services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    mem_limit: 4g  # adjust after measuring (HARNESS L3)
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - bot-data:/app/data
    stop_grace_period: 600s  # a running job is allowed to finish

volumes:
  bot-data:
